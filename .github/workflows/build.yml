name: Build

# Build check for pull requests. Does everything the deploy workflow does
# except publish, so a PR fails here rather than after merging.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The theme is a git submodule. Without this the build fails with
          # confusing "missing layout" errors rather than "missing theme".
          submodules: recursive
          # enableGitInfo derives lastmod from git history, which needs it all.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm ci, not install: respect the lock file. This also provides Hugo,
        # via the hugo-extended package — do not install Hugo separately.
        run: npm ci

      - name: Cache Hugo build artefacts
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-resources-${{ runner.os }}-${{ hashFiles('assets/**', 'config/**') }}
          restore-keys: hugo-resources-${{ runner.os }}-

      - name: Build
        run: npx hugo --gc --minify --environment production

      - name: Build search index
        # Pagefind indexes the built output, so it has to run after Hugo.
        run: npx -y pagefind --site public

      - name: Report build output
        run: |
          echo "pages built: $(find public -name index.html | wc -l)"
          du -sh public
